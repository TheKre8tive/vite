<!DOCTYPE html>
<html>
<head>
    <title>vite - Monorepo Index</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { color: #24292e; }
        .info { background: #f6f8fa; padding: 15px; border-radius: 6px; margin: 20px 0; }
        .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .app-card { border: 1px solid #e1e4e8; padding: 15px; border-radius: 6px; }
        .app-card h3 { margin: 0 0 10px 0; color: #0366d6; }
    </style>
</head>
<body>
    <h1>🌌 vite</h1>
    <div class="info">
        <strong>Monorepo Index</strong><br>
        This repository contains multiple applications and services.
    </div>
    <h2>Sub-Applications</h2>
    <div class="apps">
        <div class="app-card">
            <h3>App 1</h3>
            <p>Build and deploy individual apps from this monorepo.</p>
        </div>
        <div class="app-card">
            <h3>App 2</h3>
            <p>Each sub-directory contains a complete application.</p>
        </div>
    </div>
    <footer style="margin-top: 40px; color: #586069;">
        <p>© 2026 CyGeL White / Kre8tive Holdings</p>
    </footer>
</body>
</html>
